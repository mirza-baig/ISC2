<!DOCTYPE HTML>
<html>

<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
	<meta name="description" content="www.isc2.org Sitemap" />
	<meta name="keywords" content="www.isc2.org, Sitemap" />
	<title>Sitemap</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
			color: #444;
		}

		#sitemap {
			max-width: 980px;
			margin: 0 auto;
		}

		#sitemap__table {
			width: 100%;
			border: solid 1px #ccc;
			border-collapse: collapse;
		}

		#sitemap__table tr td.loc {
			direction: ltr;
		}

		#sitemap__table tr th {
			text-align: left;
		}

		#sitemap__table tr td,
		#sitemap__table tr th {
			padding: 10px;
		}

		#sitemap__table tr:nth-child(odd) td {
			background-color: #eee;
		}

		a:hover {
			text-decoration: none;
		}
	</style>
</head>

<body>
	<div id="sitemap">
		<div id="sitemap__header">
			<h1>Sitemap</h1>
			<p>This XML Sitemap is generated by ISC2.org to make your content more visible for search engines.</p>
			<p><a href="https://www.sitemaps.org/">Learn more about XML sitemaps.</a></p>
		</div>
		<div id="sitemap__content">
			<p class="text">Number of URLs in this XML Sitemap: <span id="url-count"></span>.</p>
			<table id="sitemap__table">
				<thead>
					<tr>
						<th class="loc">URL</th>
						<th class="lastmod">Last Modified</th>
					</tr>
				</thead>
				<tbody>
					<!-- The sitemap will be populated here -->
				</tbody>
			</table>
		</div>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			fetch('/sitemap.xml')
				.then(response => response.text())
				.then(str => new DOMParser().parseFromString(str, 'text/xml'))
				.then(data => {
					const sitemap = data.getElementsByTagName('url');
					const urlCount = sitemap.length;
					document.getElementById('url-count').textContent = urlCount;
	
					Array.from(sitemap).forEach(url => {
						const loc = url.getElementsByTagName('loc')[0].textContent;
						const lastmod = url.getElementsByTagName('lastmod')[0].textContent;
						const row = `<tr><td class="loc"><a href="${loc}">${loc}</a></td><td class="lastmod">${lastmod}</td></tr>`;
						document.querySelector('#sitemap__table tbody').insertAdjacentHTML('beforeend', row);
					});
				})
				.catch(error => {
					console.error('Failed to fetch the XML sitemap:', error);
				});
		});
	</script>
</body>

</html>
