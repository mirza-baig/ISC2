Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Content Authoring/Content Editor/Context Menu/Enable Secure Access/Reset All Secure
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $selectedItem = Get-Item -Path "."
    
    $allTemplate =  Get-ChildItem -path "/sitecore/templates/Project/ISC2/Custom Pages" -Recurse | Where-Object { $_.TemplateName -eq 'Template' }  | Foreach {"$($_.Name)"}
    
    ##| Where-Object { $_.TemplateName -eq 'Article' } | ForEach-Object { $_.Paths.FullPath }
    
    if($allTemplate -contains $selectedItem.TemplateName)
    {
        if($selectedItem.Fields["membersOnly"] -ne $null)
        {
            $selectedItem.Editing.BeginEdit()
            $selectedItem.Fields["membersOnly"].Value = "0";
            $selectedItem.Editing.EndEdit()
        }
        
        if($selectedItem.Fields["candidateOnly"] -ne $null)
        {
            $selectedItem.Editing.BeginEdit()
            $selectedItem.Fields["candidateOnly"].Value = "0";
            $selectedItem.Editing.EndEdit()
            
        }
    
        Show-Alert -Title "Operation completed."
        Close-Window
    }
    else
    {
        Show-Alert -Title "In valid item selected for the operation."
        Close-Window
    }
    
