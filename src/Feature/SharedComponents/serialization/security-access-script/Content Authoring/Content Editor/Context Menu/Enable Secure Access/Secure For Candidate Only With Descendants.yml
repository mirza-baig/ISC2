Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Content Authoring/Content Editor/Context Menu/Enable Secure Access/Secure For Candidate Only With Descendants
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $selectedItem = Get-Item -Path "."
    
    $allTemplate =  Get-ChildItem -path "/sitecore/templates/Project/ISC2/Custom Pages" -Recurse | Where-Object { $_.TemplateName -eq 'Template' }  | Foreach {"$($_.Name)"}
    
    ##| Where-Object { $_.TemplateName -eq 'Article' } | ForEach-Object { $_.Paths.FullPath }
    
    if($allTemplate -contains $selectedItem.TemplateName)
    {
        if($selectedItem.Fields["candidateOnly"] -ne $null)
        {
            $selectedItem.Editing.BeginEdit()
            $selectedItem.Fields["candidateOnly"].Value = "1";
            $selectedItem.Editing.EndEdit()
            
            
            $childPages = Get-ChildItem -path "."
            
            foreach($page in $childPages)
            {
                if($allTemplate -contains $page.TemplateName)
                {
                    if($page.Fields["candidateOnly"] -ne $null)
                    {
                        $page.Editing.BeginEdit()
                        $page.Fields["candidateOnly"].Value = "1";
                        $page.Editing.EndEdit()
                    }
        
                }
        
            }
        }
        else
        {
            Show-Alert -Title "Item do not have Candidate fields on it."
            Close-Window
        }
    
        Show-Alert -Title "Operation completed."
        Close-Window
    }
    else
    {
        Show-Alert -Title "In valid item selected for the operation."
        Close-Window
    }
