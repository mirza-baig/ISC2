Path: /sitecore/system/Modules/PowerShell/Script Library/Utility/Publishing And Unpublishing
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Set variables
    $itemPath = "master:\sitecore\content\ISC2\Main\Home"
    $sourceDb = Get-Database "master"
    $targetDb = Get-Database "experienceedge"
    # Get the item
    $item = Get-Item -Path $itemPath
    if (-not $item) {
        Write-Host "❌ Item not found at $itemPath"
        return
    }
    # Prepare parameters
    $targets = @($targetDb)  
    $languages = @([Sitecore.Globalization.Language]::Parse("en"))
    # Invoke the publishing job
    $job = [Sitecore.Publishing.PublishManager]::PublishItem(
        $item,
        $targets,
        $languages,
        $true,   # deep
        $true    # compareRevisions
    )
    Write-Host "⏳ Publishing in progress..."
    [Sitecore.Publishing.PublishManager]::WaitFor(
        $job,
    600000,
    20    
    )
    Write-Host "✅ Publish process completed successfully."
