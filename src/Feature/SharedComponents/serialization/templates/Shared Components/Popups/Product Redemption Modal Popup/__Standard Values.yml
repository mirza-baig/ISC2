    - ID: "eeada4e5-4697-44c3-8966-ef7380c10a35"
      Hint: consentBodyText
      Value: |
        <p><span>In consideration of the non-profit organization International Information System Security Certification Consortium, Inc&acute;s (hereinafter &ldquo;ISC2&rdquo;) review of my examination results and membership status, I hereby voluntarily consent to and authorize ISC2, or its authorized agents bearing this release or copy thereof, to release my examination results and membership status to <strong>{employerName}</strong> (Employer, University, or other third-party, hereinafter &ldquo;Recipient&rdquo;) for purposes of verifying my examination results and membership status. I agree that this information may include any of the following:</span></p>
        <ul>
            <li><span>First and Last Name</span></li>
            <li><span>E-mail Address</span></li>
            <li><span>Date of Exam</span></li>
            <li><span>Certification Exam Taken</span></li>
            <li><span>Examination Results (passed of failed result) not examination score</span></li>
            <li><span>Membership Status</span></li>
        </ul>
        <p><span>I authorize ISC2, or its authorized agents, to disclose such information to Recipient. I hereby release ISC2, its authorized agents, and all persons and organizations providing information of all claims and liabilities of any nature regarding this request.<br />
        <br />
        I also understand that this information may become a part of my member file with ISC2, regardless of the outcome of this request and/or my final status as an applicant. Notwithstandingthis, ISC2 will release information collected pursuant to this request only with Recipient, for the express purposes described above, or as required by law, by an governmental or regulatory authority, or by a court or other authority of competent jurisdiction.<br />
        <br />
        FOR MEMBERS LOCATED OUTSIDE OF THE UNITED STATES: I consent to the transfer of the data described above to Recipient solely for the purposes described above. I acknowlege that ISC2 is based in the United States, and such data will be transferred from the United States to the country where Recipient is located for processing. </span></p>
        <p>&nbsp;</p>
